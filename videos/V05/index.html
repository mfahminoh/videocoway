<script>
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const E = {
  out: x => 1 - Math.pow(1 - x, 3), in: x => x * x * x,
  inOut: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  back: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  elastic: x => x === 0 ? 0 : x === 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (2 * Math.PI) / 3) + 1,
};
const p = (t, t0, t1, e = E.out) => e(clamp((t - t0) / (t1 - t0)));
const mix = (a, b, k) => a + (b - a) * k;
const interp = (x, pts) => { if (x <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) if (x <= pts[i][0]) { const [a, u] = pts[i - 1], [b, v] = pts[i]; return u + (v - u) * (x - a) / (b - a); }
  return pts[pts.length - 1][1]; };

function set(el, { o = 1, x = 0, y = 0, s = 1, r = 0, blur = 0 } = {}) {
  el = typeof el === 'string' ? $(el) : el;
  el.style.opacity = o;
  el.style.visibility = o <= 0.001 ? 'hidden' : 'visible';
  el.style.transform = `translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;
  el.style.filter = blur > 0.05 ? `blur(${blur}px)` : '';
}
// masuk/keluar standard
function inout(id, t, tin, tout, { dy = 60, dur = .45, outDur = .3, pop = false, sFrom = .8, dx = 0 } = {}) {
  const a = p(t, tin, tin + dur, pop ? E.back : E.out);
  const b = tout == null ? 0 : p(t, tout, tout + outDur, E.in);
  set(id, { o: Math.min(clamp(a * 1.4), 1 - b), x: mix(dx, 0, a), y: mix(dy, 0, a) - b * 50,
            s: pop ? mix(sFrom, 1, a) : 1, blur: (1 - clamp(a * 1.3)) * 8 + b * 8 });
}
const show = (id, on) => set(id, { o: on ? 1 : 0 });

/* ===== Babak (masa voiceover, saat) ===== */
const S = { s2a: 3.62, s2b: 6.3, s3: 9.6, s4: 14.4, s5: 21.2, s6a: 25.2, s6b: 28.75, s7: 31.2, end: V.dur - V.off };
window.DURATION = V.dur;

/* ===== Klip sendiri: bingkai dipramuat, dipilih ikut masa ===== */
const CLIPS = {
  clip2: { dir: '../../out/frames/v05_clip2/', n: 90 },
  clip5: { dir: '../../out/frames/v05_clip5/', n: 121 },
};
const cache = {};
const url = (c, i) => `${CLIPS[c].dir}${String(i).padStart(4, '0')}.jpg`;
window.READY = Promise.all(Object.keys(CLIPS).flatMap(c => Array.from({ length: CLIPS[c].n }, (_, k) => {
  const im = new Image(); im.src = url(c, k + 1); cache[im.src] = im; return im.decode().catch(() => {});
})));
// peta masa voiceover -> masa klip (dipercepat supaya 40/50/60 muncul tepat dengan suara)
const MAP2 = [[S.s3, 0.0], [10.69, 0.12], [11.23, 0.55], [11.88, 1.95], [S.s4, 2.95]];
const MAP5 = [[S.s6a, 0.0], [S.s6b, 3.95]];

/* ===== Kapsyen: frasa -> potongan 1-3 perkataan ===== */
const CHUNKS = [];
V.phrases.forEach(([a, b, text], k) => {
  const words = text.split(' ');
  const groups = [];
  let cur = [];
  words.forEach(w => { cur.push(w); const len = cur.join(' ').replace(/\*/g, '').length;
    if (cur.length >= 3 || len >= 16 || /[,.?]$/.test(w)) { groups.push(cur); cur = []; } });
  if (cur.length) groups.push(cur);
  const tot = groups.reduce((s, g) => s + g.join(' ').length, 0);
  let t0 = a;
  groups.forEach(g => { const d = (b - a) * g.join(' ').length / tot;
    CHUNKS.push({ t0, t1: t0 + d, html: g.join(' ').replace(/\*([^*]+)\*/g, '<b>$1</b>') }); t0 += d; });
});
CHUNKS.forEach((c, i) => { c.hold = i + 1 < CHUNKS.length ? Math.min(CHUNKS[i + 1].t0, c.t1 + .45) : c.t1 + .6; });

function ring(id, k, color) {
  const r = 54, L = 2 * Math.PI * r;
  $(id).innerHTML = k <= 0 ? '' : `<circle cx="60" cy="60" r="${r}" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="7"/>
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${L * k} ${L}" transform="rotate(-90 60 60)"/>`;
}

function seek(T) {
  const t = T - V.off;               // masa voiceover
  const within = (a, b) => t >= a && t < b;

  /* ---------- latar ---------- */
  show('bgNavy', t < S.s2a);
  show('bgDark', within(S.s2a, S.s3) || within(S.s4, S.s6a));
  show('bgBlack', within(S.s6b, S.s7));
  show('bgBlue', t >= S.s7);
  const f = Math.max(...[S.s2a, S.s3, S.s4, S.s6a, S.s6b, S.s7].map(s => within(s, s + .25) ? 1 - (t - s) / .25 : 0));
  set('flash', { o: f * .35 });

  /* ---------- S1 ---------- */
  const o1 = S.s2a - .15;
  inout('s1t1', t, 0.0, o1, { dy: -40 });
  inout('s1t2', t, 0.15, o1, { pop: true, sFrom: .6, dy: 0 });
  ['av1', 'av2', 'av3', 'av4'].forEach((k, i) => {
    const t0 = .35 + i * .25, a = p(t, t0, t0 + .6, E.elastic), b = p(t, o1 - .1, o1 + .25, E.in);
    const bob = Math.sin((t - t0) * 3 + i * 1.7) * 6 * clamp(t - t0 - .6);
    set(k, { o: Math.min(clamp((t - t0) * 6), 1 - b), s: mix(.2, 1, a) * mix(1, 1.4, b), y: bob, blur: b * 10 });
    const bub = $(k).querySelector('.bub'), ba = p(t, 1.45 + i * .2, 1.8 + i * .2, E.back);
    set(bub, { o: clamp(ba * 2), s: mix(.3, 1, ba), y: mix(30, 0, ba) });
  });

  /* ---------- S2a: produk ---------- */
  {
    const a = p(t, S.s2a, S.s2a + .8), b = p(t, S.s2b - .2, S.s2b + .1, E.in);
    const fl = Math.sin(t * 2.2) * 6 * a;
    set('prod', { o: Math.min(clamp(a * 1.6), 1 - b), y: mix(140, 0, a) + fl, s: mix(.85, 1, a) * mix(1, 1.6, b), blur: (1 - clamp(a * 1.4)) * 12 + b * 6 });
    set('glow', { o: Math.min(a, 1 - b) * (.85 + Math.sin(t * 3) * .15), s: mix(.5, 1, a) });
    inout('s2brand', t, S.s2a + .3, S.s2b - .2, { dy: 30 });
    inout('s2big', t, 5.05, S.s2b - .2, { pop: true, sFrom: .5, dy: 0 });
  }

  /* ---------- Panel ---------- */
  const panelOn = within(S.s2b, S.s3) || within(S.s4, S.s6a);
  {
    const ins = [S.s2b, S.s4, S.s5].find(s => within(s, s + 1)) ?? -9;
    const outs = [S.s3, S.s6a].find(s => within(s - .25, s)) ?? 999;
    const a = p(t, ins, ins + .45, E.back), b = p(t, outs - .25, outs, E.in);
    const scale = t >= S.s4 ? .86 : 1, top = t >= S.s4 ? -90 : 0;
    set('panel', { o: panelOn ? Math.min(clamp(a * 2), 1 - b) : 0, s: mix(.9, 1, a) * scale * mix(1, .92, b), y: top + mix(50, 0, a) });
    let pill = '', col = '', fg = '#fff';
    if (within(S.s2b, S.s3)) { pill = 'AIR PANAS'; col = 'var(--hot)'; }
    else if (within(S.s4, S.s5)) { pill = 'ISIPADU'; col = 'var(--sky)'; fg = '#04213f'; }
    else if (within(S.s5, S.s6a)) { pill = 'ADA BUDAK KECIL?'; col = 'var(--yellow)'; fg = 'var(--navy)'; }
    $('headPill').textContent = pill; $('headPill').style.background = col; $('headPill').style.color = fg;
    const hs = [S.s2b, S.s4, S.s5].find(s => within(s, s + 1)) ?? -9;
    const ha = p(t, hs + .1, hs + .5, E.back);
    set('head', { o: panelOn ? Math.min(clamp(ha * 2), 1 - b) : 0, s: mix(.6, 1, ha) });

    // LED & ikon aktif
    let num = '', unit = '', on = '';
    if (within(S.s2b, S.s3)) { on = 'iHot'; unit = '°C'; num = t < 7.85 ? '95' : t < 8.6 ? '80' : '70'; }
    if (within(S.s4, S.s5)) { on = 'iAmt'; unit = 'ml';
      num = t < 17.1 ? '120' : t < 17.6 ? '250' : t < 18.19 ? '500' : t < 19.95 ? '1000' : '∞'; if (num === '∞') unit = ''; }
    if (within(S.s5, S.s6a)) { on = 'iLock'; unit = '°C'; num = '95'; }
    $('ledNum').textContent = num; $('ledUnit').textContent = unit;
    $('ledNum').style.fontSize = num.length >= 4 ? '200px' : '230px';
    ['iHot', 'iLock', 'iAmb', 'iWarm', 'iAmt', 'iCold'].forEach(k => $(k).classList.toggle('on', k === on));
    $('iHot').style.color = on === 'iHot' ? 'var(--hot)' : '';
    // LED "berdenyut" setiap nombor baru
    const changes = [6.3, 7.04, 7.85, 8.6, 14.4, 16.19, 17.1, 17.6, 18.19, 19.95];
    const lastC = Math.max(...changes.filter(c => c <= t), -9);
    const pulse = 1 - p(t, lastC, lastC + .35);
    $('led').style.transform = `scale(${1 + pulse * .12})`;
    $('led').style.opacity = within(S.s5 + 2.3, S.s6a) ? .35 : 1;
    // riak tekan
    const taps = [[7.04, 'iHot'], [7.85, 'iHot'], [8.6, 'iHot'], [16.19, 'iAmt'], [17.1, 'iAmt'], [17.6, 'iAmt'], [18.19, 'iAmt'], [19.95, 'iAmt'], [22.47, 'iLock']];
    const tp = taps.filter(([c]) => c <= t).pop();
    if (tp && t - tp[0] < .5) {
      const ic = $(tp[1]), k = p(t, tp[0], tp[0] + .5);
      $('tap').style.left = (ic.offsetLeft + 110) + 'px'; $('tap').style.top = (ic.offsetTop + 39) + 'px';
      set('tap', { o: 1 - k, s: mix(.3, 1.3, k) });
    } else set('tap', { o: 0 });
    // kunci 3 saat
    ring('ringLock', within(22.47, S.s6a) ? p(t, 22.47, 23.45, x => x) : 0, 'var(--yellow)');
    ring('ringHot', 0, '');
  }
  // cip panas
  ['hc0', 'hc1', 'hc2'].forEach((k, i) => { const t0 = [7.04, 7.85, 8.6][i], a = p(t, t0, t0 + .35, E.back), b = p(t, S.s3 - .25, S.s3, E.in);
    set(k, { o: within(S.s2b, S.s3) ? Math.min(clamp(a * 2), 1 - b) : 0, s: mix(.4, 1, a) }); });
  set('hotChips', { o: 1 });
  // bekas isipadu
  {
    const on = within(S.s4, S.s5), a = p(t, S.s4 + .3, S.s4 + .8, E.back), b = p(t, S.s5 - .25, S.s5, E.in);
    set('vessel', { o: on ? Math.min(clamp(a * 2), 1 - b) : 0, s: mix(.5, 1, a) });
    const jug = t >= 18.19;
    const d = jug ? 'M60 30 H240 L250 310 H50 Z' : 'M95 60 H205 L195 310 H105 Z';
    $('glassPath').setAttribute('d', d); $('glassOutline').setAttribute('d', d);
    const lvl = t < 16.19 ? 0 : t < 17.1 ? .35 : t < 17.6 ? .55 : t < 18.19 ? .8 : t < 19.95 ? .9 : .92 + Math.sin(t * 6) * .03;
    const top = jug ? 30 : 60, h = (310 - top) * lvl;
    const fillK = p(t, [16.19, 17.1, 17.6, 18.19, 19.95].filter(c => c <= t).pop() ?? 0, ([16.19, 17.1, 17.6, 18.19, 19.95].filter(c => c <= t).pop() ?? 0) + .4);
    $('water').setAttribute('y', 310 - h * mix(.85, 1, fillK)); $('water').setAttribute('height', h);
    $('volLab').textContent = t < 17.1 ? '120ml' : t < 17.6 ? '250ml' : t < 18.19 ? '500ml' : t < 19.95 ? '1 liter' : 'tanpa had';
    const la = p(t, 16.19, 16.6, E.back);
    set('volLab', { o: on && t >= 16.19 ? Math.min(clamp(la * 2), 1 - b) : 0, x: t >= 19.95 ? -40 : 0 });
  }
  // kunci besar
  {
    const on = within(S.s5, S.s6a), a = p(t, 23.42, 23.8, E.back), b = p(t, S.s6a - .25, S.s6a, E.in);
    set('bigLock', { o: on ? Math.min(clamp(a * 2), 1 - b) : 0, s: mix(.3, 1, a) });
    $('shackle').setAttribute('transform', `translate(0 ${-24 * (1 - p(t, 23.75, 23.95, E.in))})`);
  }

  /* ---------- Klip ---------- */
  let clip = null, ci = 0;
  if (within(S.s3, S.s4)) { clip = 'clip2'; ci = interp(t, MAP2); }
  if (within(S.s6a, S.s6b)) { clip = 'clip5'; ci = interp(t, MAP5); }
  let pending = Promise.resolve();
  if (clip) {
    const idx = clamp(Math.round(ci * 30) + 1, 1, CLIPS[clip].n);
    const u = new URL(url(clip, idx), location.href).href;
    if ($('clipImg').src !== u) { $('clipImg').src = u; pending = $('clipImg').decode().catch(() => {}); }
    const s0 = clip === 'clip2' ? S.s3 : S.s6a, s1 = clip === 'clip2' ? S.s4 : S.s6b;
    const kb = (t - s0) / (s1 - s0);
    set('clipL', { o: 1, s: mix(1.02, 1.08, kb) });
    set('shade', { o: 1 });
  } else { set('clipL', { o: 0 }); set('shade', { o: 0 }); }

  // S3 tindih
  inout('s3head', t, S.s3 + .15, S.s4 - .25, { pop: true, dy: 0 });
  ['wc0', 'wc1', 'wc2'].forEach((k, i) => { const t0 = [10.69, 11.23, 11.88][i], a = p(t, t0, t0 + .35, E.back), b = p(t, S.s4 - .25, S.s4, E.in);
    set(k, { o: within(S.s3, S.s4) ? Math.min(clamp(a * 2), 1 - b) : 0, s: mix(.4, 1, a) }); });
  ['pc0', 'pc1'].forEach((k, i) => { const t0 = [12.85, 13.4][i], a = p(t, t0, t0 + .35, E.back), b = p(t, S.s4 - .25, S.s4, E.in);
    set(k, { o: within(S.s3, S.s4) ? Math.min(clamp(a * 2), 1 - b) : 0, s: mix(.4, 1, a) }); });

  /* ---------- S6b: warna ---------- */
  {
    const a = p(t, S.s6b, S.s6b + .5), b = p(t, S.s7 - .25, S.s7, E.in);
    set('colors', { o: within(S.s6b, S.s7) ? Math.min(a, 1 - b) : 0, s: mix(1.12, 1.0, p(t, S.s6b, S.s7, x => x)) });
    inout('s6head', t, S.s6b + .1, S.s7 - .25, { pop: true, sFrom: .5, dy: 0 });
  }

  /* ---------- S7: promo ---------- */
  {
    const a = p(t, S.s7, S.s7 + .7);
    set('prod2', { o: a, y: mix(80, 0, a) + Math.sin(t * 2) * 5, s: mix(.8, 1, a) });
    set('glow2', { o: a * (.8 + Math.sin(t * 3) * .2) });
    inout('p1', t, 31.35, null, { dy: 30 });
    inout('p2', t, 31.9, null, { pop: true, sFrom: .3, dy: 0 });
    inout('p3', t, 32.4, null, { dy: 30 });
    inout('p4', t, 33.82, null, { pop: true, dy: 0 });
    inout('p5', t, 35.16, null, { pop: true, sFrom: .5, dy: 0 });
    if (t > 35.8) set('p5', { s: 1 + Math.max(0, Math.sin((t - 35.8) * 5)) * .05 });
    inout('p6', t, 35.6, null, { dy: 10 });
  }

  /* ---------- Kapsyen ---------- */
  {
    const c = CHUNKS.filter(c => c.t0 <= t && t < c.hold).pop();
    if (c) {
      $('capText').innerHTML = c.html;
      const a = p(t, c.t0, c.t0 + .18, E.back);
      set('cap', { o: 1, s: mix(.75, 1, a), y: mix(18, 0, a) });
    } else set('cap', { o: 0 });
    // kapsyen dinaikkan bila bekas/kunci di bawah
    $('cap').style.top = within(S.s4, S.s6a) ? '1545px' : '1520px';
  }
  return pending;
}
window.seek = seek;
</script>
</body>
</html>
