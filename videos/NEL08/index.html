<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform vec2 uRes;
uniform vec4 uL[48]; uniform int uNL;                     // bola cecair: x y r mat
uniform vec4 uC[16]; uniform vec4 uCR[16]; uniform int uNC; // kapsul cecair: ax ay bx by | ra rb mat 0
uniform vec4 uS[72]; uniform int uNS;                      // bola pepejal (logam, bakteria): x y r mat
uniform vec4 uW[2]; uniform int uNW;                       // gelombang: front, arah (+1 naik dari bawah, -1 turun dari atas), amp, fasa
uniform float uWM[2];
uniform vec3 uD[12]; uniform vec3 uLi[12];                 // warna bahan: dalam (gelap) / cerah
uniform vec3 uBg0; uniform vec3 uBg1;
uniform sampler2D uTex; uniform vec4 uTxt;                 // campur A->B, grow, on, mat
uniform float uKL; uniform float uKS;
out vec4 o;

void smin(inout float d, inout vec2 g, inout vec3 cd, inout vec3 cl, float d2, vec2 g2, int m, float k) {
  float h = clamp(0.5 + 0.5 * (d2 - d) / k, 0.0, 1.0);
  d = mix(d2, d, h) - k * h * (1.0 - h);
  g = mix(g2, g, h); cd = mix(uD[m], cd, h); cl = mix(uLi[m], cl, h);
}
vec3 shade(float d, vec2 g, vec3 cd, vec3 cl, float B) {
  float x = clamp(-d / B, 0.0, 1.0);
  float s = min((1.0 - x) / sqrt(max(1e-4, 1.0 - (1.0 - x) * (1.0 - x))), 6.0);
  vec3 n = normalize(vec3(normalize(g + 1e-6) * s, 1.0));
  vec3 L = normalize(vec3(-0.45, -0.75, 0.8));
  float dif = clamp(dot(n, L), 0.0, 1.0);
  vec3 col = mix(cd, cl, 0.12 + 0.78 * dif);
  float sp = pow(max(dot(n, normalize(L + vec3(0.0, 0.0, 1.0))), 0.0), 80.0) * 1.15;
  float sp2 = pow(max(dot(n, normalize(normalize(vec3(0.7, 0.55, 0.5)) + vec3(0.0, 0.0, 1.0))), 0.0), 26.0) * 0.22;
  float fr = pow(1.0 - n.z, 2.4) * 0.5;
  return col + vec3(sp + sp2) + cl * fr;
}
float ta(vec2 p) { vec4 t = texture(uTex, p / uRes); return mix(t.r, t.g, uTxt.x); }
float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

void main() {
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  float r = length((p - vec2(540.0, 760.0)) / vec2(820.0, 1250.0));
  vec3 col = mix(uBg0, uBg1, smoothstep(0.0, 1.15, r));

  // ---- kumpulan cecair (bola + kapsul + teks), bercantum dengan smooth-min ----
  float d = 1e5; vec2 g = vec2(0.0, -1.0); vec3 cd = vec3(0.0), cl = vec3(0.0);
  for (int i = 0; i < 48; i++) { if (i >= uNL) break;
    vec2 q = p - uL[i].xy; float l = max(length(q), 1e-3);
    smin(d, g, cd, cl, l - uL[i].z, q / l, int(uL[i].w), uKL); }
  for (int i = 0; i < 16; i++) { if (i >= uNC) break;
    vec2 a = uC[i].xy, ba = uC[i].zw - a, pa = p - a;
    float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-3), 0.0, 1.0);
    vec2 q = pa - ba * h; float l = max(length(q), 1e-3);
    smin(d, g, cd, cl, l - mix(uCR[i].x, uCR[i].y, h), q / l, int(uCR[i].z), uKL); }
  if (uTxt.z > 0.5) {
    float a0 = ta(p);
    float dt = (0.5 - a0) * 36.0 - uTxt.y;
    vec2 gt = -vec2(ta(p + vec2(2.0, 0.0)) - ta(p - vec2(2.0, 0.0)), ta(p + vec2(0.0, 2.0)) - ta(p - vec2(0.0, 2.0)));
    smin(d, g, cd, cl, dt, gt, int(uTxt.w), uKL);
  }
  // ---- kumpulan pepejal (logam, bakteria, virus) ----
  float ds = 1e5; vec2 gs = vec2(0.0, -1.0); vec3 sd = vec3(0.0), sl = vec3(0.0);
  for (int i = 0; i < 72; i++) { if (i >= uNS) break;
    vec2 q = p - uS[i].xy; float l = max(length(q), 1e-3);
    smin(ds, gs, sd, sl, l - uS[i].z, q / l, int(uS[i].w), uKS); }

  float dm = min(d, ds);
  col *= 1.0 - 0.32 * (1.0 - smoothstep(0.0, 70.0, dm));            // bayang lembut di sekeliling
  col = mix(col, shade(d, g, cd, cl, 46.0), clamp(0.5 - d, 0.0, 1.0));
  col = mix(col, shade(ds, gs, sd, sl, 30.0), clamp(0.5 - ds, 0.0, 1.0));

  // ---- gelombang: hadapan beralun dengan 3 bonjolan beza fasa ----
  for (int i = 0; i < 2; i++) { if (i >= uNW) break;
    vec4 w = uW[i]; float x = p.x;
    float f = w.x + w.z * (0.6 * sin(x * 0.0062 + w.w) + 0.3 * sin(x * 0.0131 + w.w * 1.7 + 1.3) + 0.16 * sin(x * 0.0213 + w.w * 2.3 + 2.1));
    float fp = w.z * (0.6 * 0.0062 * cos(x * 0.0062 + w.w) + 0.3 * 0.0131 * cos(x * 0.0131 + w.w * 1.7 + 1.3) + 0.16 * 0.0213 * cos(x * 0.0213 + w.w * 2.3 + 2.1));
    float k = sqrt(1.0 + fp * fp);
    float dw = (f - p.y) * w.y / k;
    vec2 gw = vec2(fp, -1.0) * w.y / k;
    int m = int(uWM[i]);
    col *= 1.0 - 0.35 * (1.0 - smoothstep(0.0, 60.0, dw));
    col = mix(col, shade(dw, gw, uD[m], uLi[m], 90.0), clamp(0.5 - dw, 0.0, 1.0));
  }
  col += (hash(p) - 0.5) / 255.0;
  o = vec4(col, 1.0);
}
</script>

/* ================= fizik cecair ================= */
/* titis dari mulut M: terbentuk (tF→tS), leher memanjang lalu putus pada tS, jatuh, squash + percikan di landY */
function drip(F, M, tF, tS, landY, R, mat, t, { splash = true } = {}) {
  const yS = M.y + R + 26, tL = tS + Math.sqrt(2 * (landY - yS) / G);
  if (t < tF) return tL;
  if (t < tS) {
    const u = inv(tF, tS, t), r = mix(5, R, E.outQt(u)), cy = M.y + mix(6, R + 26, E.inOut(u));
    F.C.push([M.x, M.y, M.x, cy, 13 + 4 * u, r, mat]); return tL;
  }
  const dt = t - tS, k = inv(tS, tS + .2, t);
  if (k < 1) F.C.push([M.x, M.y, M.x, M.y + (yS - M.y) * .7 * (1 - E.outQt(k)), 12, 4 + 5 * (1 - k), mat]);   // leher putus & mengecut
  F.L.push([M.x, M.y + 5 + 7 * Math.exp(-7 * dt) * Math.sin(dt * 34), 14, mat]);                              // manik di mulut melantun
  if (t < tL) {
    const y = yS + .5 * G * dt * dt, tail = Math.min(G * dt * .028, 80);
    F.C.push([M.x, y - tail, M.x, y, R * .5, R, mat]);
    const d2 = dt - .09; if (d2 > 0) F.L.push([M.x, yS + .5 * G * d2 * d2 - R * 1.3, R * .26, mat]);        // titis sekunder lewat 3 bingkai
    return tL;

  if (splash) [[-260, -950, 11], [230, -1050, 13], [-470, -640, 9], [420, -720, 10]].forEach(([vx, vy, r], i) => {
    const s = ds - i * .03; if (s <= 0) return; const y = landY - 12 + vy * s + .5 * G * s * s;
    if (y < landY + 12) F.L.push([M.x + vx * s, y, r, mat]);
  });

const ELS = [
  { k: 'hg', sym: 'Hg', name: 'MERKURI', m: 2, x: 300, y: 690, ink: '#1E2530', src: 3 },
  { k: 'pb', sym: 'Pb', name: 'PLUMBUM', m: 3, x: 780, y: 690, ink: C.CR, src: 7 },
  { k: 'fe', sym: 'Fe', name: 'BESI', m: 4, x: 300, y: 1110, ink: C.CR, src: 11 },
  { k: 'al', sym: 'Al', name: 'ALUMINIUM', m: 5, x: 780, y: 1110, ink: '#1E2530', src: 14 },
].map(e => ({ ...e, sg: (() => { const g = Gp(B2); text(g, e.sym, 0, 40, 118, e.ink, { family: 'Lilita', weight: 400 }); return g; })(),
  ng: (() => { const g = Gp(B2); text(g, e.name, 0, 0, 42, C.CR, { track: 3 }); return g; })() }));

/* ---- babak 3: Neon + Nanotrap ---- */
const B3 = Gp(S);
const prod = Gp(B3); svg('image', { href: '../../assets/img/neon/lineup5.png', x: -500, y: -650, width: 1000, height: 1000 }, prod);
const t3a = letters(B3, 'COWAY NEON', 540, 990, 120, C.CR);
const t3b = text(B3, 'GUNA PENAPIS', 90, 1120, 52, C.CR, { anchor: 'start', track: 3 });
const t3c = letters(B3, 'NANOTRAP', 90, 1262, 138, C.SKY, 'Lilita', 400, 2, 'start');
const filt = Gp(B3); svg('image', { href: '../../assets/img/neon/nanotrap.png', x: -100, y: -190, width: 200, height: 378 }, filt);

/* ---- babak 4: penapisan ---- */
const B4 = Gp(S), MEM = 930;
const mem = Gp(B4);
svg('rect', { x: 60, y: MEM, width: 960, height: 60, rx: 30, fill: '#FFFFFF', 'fill-opacity': .1, stroke: C.SKY, 'stroke-width': 4 }, mem);
for (let i = 0; i < 46; i++) for (let j = 0; j < 2; j++) svg('circle', { cx: 86 + i * 20.4 + j * 10, cy: MEM + 20 + j * 20, r: 4.2, fill: C.SKY, 'fill-opacity': .55 }, mem);
const memLab = text(B4, 'NANOTRAP', 1000, MEM + 100, 34, C.SKY, { anchor: 'end', track: 4 });
const t4h = text(B4, 'DITAPIS:', 60, 360, 50, C.CR, { anchor: 'start', track: 4 });
const CHIPS = [['LOGAM BERAT', 'catch1'], ['BAKTERIA', 'catch2'], ['VIRUS', 'catch3']].map(([s, k], i) => {
  const g = Gp(B4), w = width('900 40px Nunito', s) + 110;
  svg('rect', { x: 0, y: -36, width: w, height: 72, rx: 36, fill: C.CR }, g);
  svg('circle', { cx: 38, cy: 0, r: 20, fill: C.CO }, g);
  svg('path', { d: 'M30 -8 L46 8 M46 -8 L30 8', stroke: '#fff', 'stroke-width': 6, 'stroke-linecap': 'round' }, g);
  text(g, s, 72, 14, 40, C.NAVY, { anchor: 'start' }); return { g, k, y: 440 + i * 92 };
});
const DROPX = [480, 640, 800, 560, 720, 880, 520, 680, 840, 600, 760, 500, 820];
const KIND = [3, 4, 5, 2, 4, 3, 5, 6, 6, 7, 7, 7, 7];
const REST = DROPX.map((_, k) => 150 + k * 64);

/* ---- babak 5–6: BERSIH → RM54 ---- */
const B5 = Gp(S);
const t5a = text(B5, 'AIR', 540, 600, 70, C.CR, { track: 8 });
const t5b = text(B5, 'TERUS DARI DAPUR', 540, 1040, 54, C.CR, { track: 4 });
const B6 = Gp(S);
const was = Gp(B6); text(was, 'HARGA ASAL', 0, -120, 50, C.CR, { track: 4, op: .75 }); text(was, 'RM104', 0, 20, 140, C.CR, { family: 'Lilita', weight: 400 });
const strike = svg('rect', { x: 0, y: -11, width: 0, height: 22, rx: 11, fill: C.CO }, Gp(B6));
const t6now = text(B6, 'PROMOSI', 540, 640, 50, C.SKY, { track: 6 });
const t6mo = text(B6, 'SEBULAN', 540, 1040, 60, C.CR, { track: 6 });
const pill = Gp(B6); svg('rect', { x: -340, y: -54, width: 680, height: 108, rx: 54, fill: C.CR }, pill);
text(pill, '+ REBAT RM20 × 7 BULAN', 0, 21, 56, C.NAVY, { family: 'Lilita', weight: 400 });
const SLOT = Array.from({ length: 7 }, (_, i) => ({ x: 150 + i * 130, y: 1310 }));
const slots = SLOT.map((s, i) => { const g = Gp(B6, { transform: `translate(${s.x} ${s.y})` });
  svg('circle', { cx: 0, cy: 0, r: 46, fill: 'none', stroke: C.SKY, 'stroke-width': 4, 'stroke-opacity': .5, 'stroke-dasharray': '8 8' }, g);
  const n = text(g, String(i + 1), 0, 16, 46, C.NAVY, { family: 'Lilita', weight: 400 }); return n; });

/* ---- babak 7: CTA ---- */
const B7 = Gp(S);
const card = Gp(B7);
svg('rect', { x: -450, y: -280, width: 900, height: 560, rx: 48, fill: '#FFFFFF' }, card);
const cclip = svg('clipPath', { id: 'cc' }, svg('defs', {}, S)); svg('rect', { x: -450, y: -280, width: 900, height: 560, rx: 48 }, cclip);
svg('image', { href: '../../assets/img/neon/lineup5.png', x: -470, y: -490, width: 940, height: 940 }, Gp(card, { 'clip-path': 'url(#cc)' }));
const t7 = letters(B7, 'COWAY NEON', 540, 990, 122, C.CR);
const TICKS = ['PROMOSI RM54 SEBULAN*', '+ REBAT RM20 × 7 BULAN*', 'PEMASANGAN PERCUMA'];
const ticks = TICKS.map(s => { const g = Gp(B7), w = width('800 42px Nunito', s);
  svg('circle', { cx: -w / 2 - 34, cy: -14, r: 20, fill: C.CR }, g);
  svg('path', { d: `M${-w / 2 - 44} -14 l7 8 l14 -15`, fill: 'none', stroke: '#0389C0', 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
  text(g, s, 18, 0, 42, C.CR, { weight: 800 }); return g; });
const BTN = { x0: 330, x1: 750, y: 1300, r: 64 };
const btnT = Gp(B7);
svg('circle', { cx: -212, cy: 0, r: 28, fill: 'none', stroke: '#fff', 'stroke-width': 7 }, btnT);
svg('path', { d: 'M-234 24 L-229 9 L-219 18 Z', fill: '#fff' }, btnT);
text(btnT, 'WhatsApp saya', 52, 21, 58, '#fff', { family: 'Lilita', weight: 400 });
const ripple = svg('ellipse', { cx: 540, cy: 1478, rx: 0, ry: 0, fill: 'none', stroke: C.CR, 'stroke-width': 4 }, B7);
const fine = Gp(B7);
text(fine, '*Harga asal RM104/bulan. Rebat ulang tahun Coway RM20 selama 7 bulan.', 540, 1745, 26, C.CR, { weight: 600, op: .9 });
text(fine, 'Tertakluk pada terma & promosi semasa Coway.', 540, 1780, 26, C.CR, { weight: 600, op: .9 });

const clip1 = waveClip(B1), clip2 = waveClip(B2), clip6 = waveClip(B6), clip5 = waveClip(B5);
/* ================= masa babak ================= */
const T = {
  w1: Q('wave1'), w2: Q('wave2'), w3: Q('wave3'), WD,
};
const BG = [[0.06, 0.2, 0.34], [0.016, 0.07, 0.14]];         // biru gelap
const bgOf = m => { const c = interior(m); return [c.map(v => v * 1.12), c.map(v => v * .5)]; };
const BG_RUST = bgOf(10), BG_DEEP = bgOf(8), BG_CTA = bgOf(11);
function background(t) {
  // selepas gelombang lengkap, latar = warna dalam gelombang itu, lalu lembut ke kecerunan
  const steps = [[T.w1, 10, BG_RUST], [T.w2, 8, BG_DEEP], [T.w3, 11, BG_CTA]];
  let bg = BG;
  for (const [t0, m, target] of steps) {
    const e = t0 + T.WD; if (t < e) break;
    const flat = interior(m), k = E.inOut(inv(e, e + .5, t));
    bg = [flat.map((v, i) => mix(v, target[0][i], k)), flat.map((v, i) => mix(v, target[1][i], k))];
  }
  return bg;
}

function frame(t) {
  const F = { L: [], C: [], S: [], W: [], bg: background(t), txt: null };
  const on = (a, b) => t >= a && t < b;

  /* ---- 1: paip, dua titis, lopak ---- */
  const s1 = on(-9, T.w1 + T.WD);
  vis(B1, s1);
  if (s1) {
    const pin = fling(inv(Q('pipe'), Q('pipe') + .5, t));
    pipe.setAttribute('transform', `translate(${mix(-1000, 0, pin)} 0)`);
    const POOL = 1330;
    const l1 = drip(F, MOUTH, Q('form1'), Q('snap1'), POOL, 46, 0, t);
    const l2 = drip(F, MOUTH, Q('form2'), Q('snap2'), POOL, 40, 0, t);
    const lvl = .55 * E.outQt(inv(l1, l1 + .5, t)) + .45 * E.outQt(inv(l2, l2 + .5, t));
    for (let i = 0; i < 13; i++) { const x = 900 + (i - 6) * 40, rr = (10 + 44 * lvl) * (1 - Math.abs(i - 6) / 8.5);
      if (lvl > 0) F.L.push([x, POOL + 40 - 5 * Math.sin(t * 4 + i), rr + 3 * Math.sin(t * 3 + i * 1.3) * lvl, 0]); }
    t1b.forEach((l, i) => popAt(l.g, t, Q('title') + i * .03, l.x, l.y, { amt: .2 }));
    rise(t1a, t, Q('title') - .15); rise(t1c, t, Q('sub'));
    setClip(clip1, t, T.w1, 1);
    wave(F, t, T.w1, 1, 10);
  }

  /* ---- 2: zarah logam dalam air karat + 4 unsur ---- */
  const s2 = on(T.w1 + .25, T.w2 + T.WD);
  vis(B2, s2);
  if (s2) {
    const fade = 1 - inv(Q('hg') - .3, Q('hg') + .2, t);   // zarah kecil mengecut bila unsur besar masuk
    SEEDS.forEach((s, i) => { if (ELS.some(e => e.src === i)) return;
      const y = s.y - s.sp * (t - T.w1) + 10 * Math.sin(t * 1.3 + s.ph);
      const r = s.r * fling(inv(T.w1 + .25 + i * .03, T.w1 + .7 + i * .03, t)) * (.35 + .65 * fade);
      if (r > .5) F.S.push([s.x + 14 * Math.sin(t * .9 + s.ph), y, r, s.m]); });
    ELS.forEach((e, i) => {
      const s = SEEDS[e.src], t0 = Q(e.k), u = inv(t0, t0 + .5, t), k = fling(u);
      const x0 = s.x + 14 * Math.sin(t0 * .9 + s.ph), y0 = s.y - s.sp * (t0 - T.w1);
      const pre = s.r * fling(inv(T.w1 + .25, T.w1 + .7, t));
      if (t < t0) { tf(e.sg, 0, 0, 0); e.ng.setAttribute('opacity', 0); F.S.push([s.x + 14 * Math.sin(t * .9 + s.ph), s.y - s.sp * (t - T.w1) + 10 * Math.sin(t * 1.3 + s.ph), pre, e.m]); return; }
      const x = mix(x0, e.x, k), y = mix(y0, e.y, k) + 6 * Math.sin(t * 2 + i);
      const wob = 1 + .1 * Math.exp(-5 * (t - t0 - .5)) * Math.sin((t - t0 - .5) * 22) * (u >= 1);
      const r = mix(pre, 150, E.outQt(u)) * wob;
      F.S.push([x, y, r, e.m]);
      [.08, .15].forEach((lag, j) => { const k2 = fling(inv(t0 + lag, t0 + .5 + lag, t)); if (k2 < 1) F.S.push([mix(x0, e.x, k2), mix(y0, e.y, k2), (26 - j * 9) * (1 - k2 * .6), e.m]); });
      popAt(e.sg, t, t0 + .2, x, y, { amt: .12 });
      const a = rise(e.ng, t, t0 + .3); e.ng.setAttribute('transform', `translate(${e.x} ${e.y + 196 - (1 - a) * -20})`);
    });
    bubbles.forEach(b => { const y = 1500 - ((t - T.w1) * b.sp + b.ph * 90) % 1300; b.e.setAttribute('cx', b.x + 12 * Math.sin(t * 2 + b.ph)); b.e.setAttribute('cy', y); });
    rise(t2a, t, Q('air')); rise(t2c, t, Q('paip'));
    t2b.forEach((l, i) => popAt(l.g, t, Q('logam') + i * .03, l.x, l.y, { amt: .2 }));
    // tajuk naik ke atas bila unsur masuk
    const up = fling(inv(Q('hg') - .35, Q('hg') + .1, t));
    t2a.setAttribute('opacity', 1 - up); t2c.setAttribute('opacity', +(t2c.getAttribute('opacity')) * (1 - up));
    t2b.forEach(l => { const g = l.g, tr = g.getAttribute('transform'); if (tr) g.setAttribute('transform', `translate(0 ${-330 * up}) ` + tr); });
    setClip(clip2, t, T.w2, -1);
    wave(F, t, T.w2, -1, 8);
  }

  /* ---- 3: Neon + Nanotrap ---- */
  const s3 = on(T.w2 + .3, Q('filter') + .1);
  vis(B3, s3);
  if (s3) {
    const n0 = Q('neon'), ex = Q('filter') - .35, o = fling(inv(ex, ex + .35, t));
    popAt(prod, t, n0, 540, 770 - 900 * o, { amt: .1 });
    for (let i = 0; i < 9; i++) { const dx = (i - 4) * 95, t0 = n0 + Math.abs(i - 4) * .04, u = fling(inv(t0, t0 + .45, t));
      if (u > 0) F.L.push([540 + dx, 800 + 30 * Math.abs(i - 4) ** .5 - 900 * o, (66 - Math.abs(i - 4) * 9) * u * (1 + .08 * Math.sin(t * 3 + i)), 1]); }
    [[-1, -620], [1, -700], [-.5, -820], [.6, -560]].forEach(([vx, vy], i) => { const s = t - n0 - .1 - i * .04; if (s <= 0) return;
      const y = 770 + vy * s + .5 * G * s * s; if (y < 800) F.L.push([540 + vx * 380 * s, y, 12 - i * 2, 1]); });
    t3a.forEach((l, i) => popAt(l.g, t, n0 + .2 + i * .03, l.x, l.y - 900 * o, { amt: .2 }));
    rise(t3b, t, Q('nano') - .25); t3c.forEach((l, i) => popAt(l.g, t, Q('nano') + i * .03, l.x, l.y, { amt: .2 }));
    popAt(filt, t, Q('nano') + .1, 905, 1230, { amt: .12 });
    B3.setAttribute('opacity', 1 - inv(ex, ex + .3, t));
  }

  /* ---- 4: membran Nanotrap ---- */
  const f0 = Q('filter'), s4 = on(f0 - .9, Q('bersih') + .5);
  vis(B4, s4);
  let clean = 0;
  if (s4) {
    const memIn = fling(inv(f0, f0 + .45, t)), out4 = inv(Q('bersih') - .35, Q('bersih') + .1, t);
    mem.setAttribute('transform', `translate(540 0) scale(${memIn * (1 - out4)} 1) translate(-540 0)`);
    memLab.setAttribute('opacity', memIn * (1 - out4)); rise(t4h, t, f0 + .2); fadeOut(t4h, t, Q('bersih') - .35);
    CHIPS.forEach(c => { const a = fling(inv(Q(c.k), Q(c.k) + .4, t)); c.g.setAttribute('transform', `translate(${mix(-500, 60, a)} ${c.y})`); c.g.setAttribute('opacity', 1 - out4); });
    const POOL2 = 1400, FALL = Math.sqrt(2 * (MEM - 10 + 80) / G);
    DROPX.forEach((x, k) => {
      const te = f0 - .55 + k * .26, dt = t - te; if (dt < 0) return;
      const y = -80 + .5 * G * dt * dt, v = G * dt, tail = Math.min(v * .028, 70), kind = KIND[k];
      const tHit = te + FALL, restX = REST[k];
      // zarah: tersangkut di atas membran
      const pr = kind >= 6 ? 17 : 19;
      let py = Math.min(y, MEM - pr - 4);
      if (t > tHit) py = MEM - pr - 4 - 16 * Math.exp(-6 * (t - tHit)) * Math.abs(Math.sin((t - tHit) * 14));
      const sh = 1 - out4;
      if (sh > 0) {
        const px = t > tHit ? mix(x, restX, fling(inv(tHit, tHit + .3, t))) : x, pdrop = out4 * 400;
        F.S.push([px, py + pdrop, pr * sh, kind]);
        if (kind === 6) for (let j = 0; j < 3; j++) { const a = t * 1.5 + j * 2.1 + k; F.S.push([px + 14 * Math.cos(a), py + pdrop + 14 * Math.sin(a), 9 * sh, 6]); }
        if (kind === 7) for (let j = 0; j < 6; j++) { const a = j * 1.047 + t * .8; F.S.push([px + 24 * Math.cos(a), py + pdrop + 24 * Math.sin(a), 6 * sh, 7]); }
      }
      // cecair: karat di atas, terhimpit melalui membran, keluar bersih di bawah
      if (y < POOL2) {
        const through = y > MEM + 30, squeeze = y > MEM - 20 && y < MEM + 80 ? .55 : 1;
        if (y < POOL2 - 10) F.C.push([x, y - tail, x, y, 24 * squeeze, 44 * squeeze, through ? 1 : 0]);
      }
      if (t > te + Math.sqrt(2 * (POOL2 + 80) / G)) clean += 1;
    });
    // kolam bersih di bawah membran
    const lv = Math.min(clean / 13, 1) * (1 - fling(inv(Q('bersih') - .1, Q('bersih') + .45, t)));
    for (let i = 0; i < 11; i++) { const x = 400 + i * 52, rr = (10 + 44 * lv) * (1 - Math.abs(i - 5) / 8);
      const up = fling(inv(Q('bersih') - .1, Q('bersih') + .5, t));
      if (lv > .01 || up > 0) F.L.push([mix(x, 540 + (x - 540) * .3, up), mix(1440 - 6 * Math.sin(t * 4 + i), 860, up), rr * (1 - up * .7), 1]); }
  }

  /* ---- 5–6: teks cecair BERSIH → RM54 ---- */
  const b0 = Q('bersih'), s5 = on(b0 - .15, T.w3 + T.WD);
  vis(B5, on(b0 - .1, Q('was'))); vis(B6, on(Q('was') - .1, T.w3 + T.WD));
  if (s5) {
    const g = fling(inv(b0 - .1, b0 + .6, t)), m = E.inOut(inv(Q('now'), Q('now') + .6, t));
    F.txt = [m, mix(-70, 0, g) + 26 * Math.sin(Math.PI * m) + 3 * Math.sin(t * 2.4), 1, 1];   // menebal di tengah morph supaya jisim kekal
    rise(t5a, t, b0 + .1); rise(t5b, t, Q('dapur')); [t5a, t5b].forEach(e => fadeOut(e, t, Q('was') - .3));
    if (t < Q('now')) drip(F, { x: 600, y: 900 }, Q('form3'), Q('snap3'), 1380, 22, 1, t, { splash: false });
    // harga
    const w0 = Q('was'), st = Q('strike'), dim = E.inOut(inv(st + .1, st + .45, t));
    if (t < w0) tf(was, 540, 480, 0); else { const [s, k] = squash(t, w0, { amt: .12 }); tf(was, 540, mix(480, 420, dim), s * mix(1, .8, dim) * (1 - k * .6), s * mix(1, .8, dim) * (1 + k)); }
    was.setAttribute('opacity', mix(1, .55, dim));
    tf(strike.parentNode, 540 - 200 * mix(1, .8, dim), mix(470, 418, dim), 1, 1, -6);
    strike.setAttribute('width', 400 * mix(1, .8, dim) * E.inOut(inv(st, st + .26, t)));
    rise(t6now, t, Q('now') - .25); rise(t6mo, t, Q('now') + .45);
    popAt(pill, t, Q('rebate'), 540, 1160, { amt: .14 });
    SLOT.forEach((s, i) => { const t0 = Q('months') + i * .11;
      slots[i].parentNode.setAttribute('opacity', fling(inv(Q('rebate') + .2 + i * .03, Q('rebate') + .5 + i * .03, t)));
      if (t >= t0) { const [sc, k] = squash(t, t0, { amt: .25 }); F.L.push([s.x, s.y + 40 * k, 40 * sc, 1]); }
      slots[i].setAttribute('opacity', t >= t0 + .1 ? 1 : 0); });
    // semua tenggelam bila gelombang CTA datang
    setClip(clip6, t, T.w3, 1); setClip(clip5, t, T.w3, 1);
    if (t > T.w3 + WD) F.txt = null;
    wave(F, t, T.w3, 1, 11);
  }

  /* ---- 7: CTA, butang cecair, titis terakhir ---- */
  const c0 = Q('card'), s7 = t >= T.w3 + .3;
  vis(B7, s7);
  if (s7) {
    popAt(card, t, c0, 540, 600 + (t > c0 + .8 ? 6 * Math.sin((t - c0) * 2.2) : 0), { amt: .1 });
    t7.forEach((l, i) => popAt(l.g, t, c0 + .15 + i * .03, l.x, l.y, { amt: .2 }));
    ticks.forEach((g, i) => { const a = fling(inv(c0 + .45 + i * .1, c0 + .85 + i * .1, t)); g.setAttribute('transform', `translate(${mix(-400, 540, a)} ${1072 + i * 58})`); });
    // dua titis hijau terbang masuk, bercantum, lalu meregang jadi butang kapsul
    const b = Q('button'), u = inv(b - .35, b + .05, t), st = E.pop(inv(b + .05, b + .5, t));
    if (t >= b - .35) {
      const bob = t > b + .8 ? 5 * Math.sin((t - b) * 4) : 0;
      if (u < 1) { const k = fling(u); F.L.push([mix(-80, 520, k), BTN.y + bob, 58, 9]); F.L.push([mix(1160, 560, k), BTN.y + bob, 58, 9]); }
      else F.C.push([mix(520, BTN.x0, st), BTN.y + bob, mix(560, BTN.x1, st), BTN.y + bob, BTN.r * mix(.95, 1, st), BTN.r * mix(.95, 1, st), 9]);
      btnT.setAttribute('transform', `translate(540 ${BTN.y + bob}) scale(${clamp(st)})`);
      const tl = drip(F, { x: 540, y: BTN.y + BTN.r - 8 + bob }, Q('form4'), Q('snap4'), 1478, 16, 9, t, { splash: false });
      const rp = inv(tl, tl + .9, t); ripple.setAttribute('rx', 160 * E.outQt(rp)); ripple.setAttribute('ry', 26 * E.outQt(rp)); ripple.setAttribute('stroke-opacity', rp > 0 ? .7 * (1 - rp) : 0);
    } else btnT.setAttribute('transform', 'scale(0)');
    fine.setAttribute('opacity', E.out(inv(c0, c0 + .4, t)));
  }
  renderGL(F);
}
MG.run(frame);
});
</script>
