<style>
@font-face{font-family:Nunito;src:url(../../../assets/fonts/NunitoSans-900.ttf);font-weight:900}
@font-face{font-family:Nunito;src:url(../../../assets/fonts/NunitoSans-800.ttf);font-weight:800}
@font-face{font-family:Nunito;src:url(../../../assets/fonts/NunitoSans-700.ttf);font-weight:700}
@font-face{font-family:Lilita;src:url(../../../assets/fonts/LilitaOne-Regular.ttf)}
@font-face{font-family:Hand;src:url(../../../assets/fonts/Pacifico-Regular.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#222}
:root{--navy:#0B2F6B;--blue:#01A7E1;--hot:#E5322D;--yellow:#FFD23F}
.poster{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:Nunito,sans-serif;margin-bottom:20px}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.panel{position:absolute;left:0;right:0;top:0;padding:44px 60px 40px;background:var(--navy);color:#fff;
  border-radius:0 0 46px 46px;box-shadow:0 14px 30px rgba(0,0,0,.35)}
.panel .l1{font:800 46px/1.15 Nunito;opacity:.92}
.panel .l2{font:400 70px/1.05 Lilita;letter-spacing:.5px;margin-top:6px}
.panel .l3{font:400 70px/1.05 Lilita;letter-spacing:.5px;margin-top:4px}
.panel .l3 mark{background:var(--yellow);color:var(--navy);padding:0 12px;border-radius:12px;display:inline-block;transform:rotate(-1.5deg)}
.unit{position:absolute;left:250px;top:612px;width:300px;filter:sepia(.12) brightness(.93) saturate(1.1) drop-shadow(0 22px 20px rgba(0,0,0,.45))}
.floor{position:absolute;left:236px;top:958px;width:340px;height:46px;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,.45),rgba(0,0,0,0) 70%)}
.nota{position:absolute;left:150px;top:470px;font:400 46px/1 Hand;color:#fff;transform:rotate(-5deg);text-shadow:0 2px 10px rgba(0,0,0,.6)}
.nota svg{position:absolute;left:250px;top:44px;width:70px;height:80px;overflow:visible}
.seal{position:absolute;right:46px;top:860px;width:230px;height:230px;border-radius:50%;background:var(--yellow);color:var(--navy);
  display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(8deg);box-shadow:0 10px 24px rgba(0,0,0,.35);border:6px solid #fff}
.seal small{font:900 22px/1 Nunito;letter-spacing:1px}
.seal strong{font:400 76px/.95 Lilita;color:var(--hot)}
.seal em{font:900 22px/1 Nunito;font-style:normal}
.chips{position:absolute;left:50%;top:1112px;transform:translateX(-50%);display:flex;gap:12px;white-space:nowrap}
.chips span{display:inline-flex;align-items:center;gap:10px;font:800 26px/1 Nunito;color:var(--navy);background:#fff;border-radius:999px;padding:13px 20px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.chips i{display:inline-block;width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(11,47,107,.25)}
.chips .dots{display:inline-flex;gap:5px}
.chips .dots i{width:20px;height:20px}
.cta{position:absolute;left:50%;top:1196px;transform:translateX(-50%);font:900 34px/1 Nunito;color:#fff;background:#25D366;border-radius:999px;
  padding:18px 40px;white-space:nowrap;box-shadow:0 8px 18px rgba(0,0,0,.3)}
.tnc{position:absolute;left:60px;right:60px;bottom:16px;text-align:center;font:700 19px/1.3 Nunito;color:var(--navy);background:rgba(255,255,255,.85);border-radius:999px;padding:8px 16px}
.agen{position:absolute;right:56px;top:392px;font:900 22px/1 Nunito;letter-spacing:2px;color:#fff;background:var(--blue);padding:10px 16px;border-radius:10px}
</style></head><body>
<div id="root"></div>
<script>
const VARIAN = [
  { id: "baby-p1-jerang-5-kali", bg: "img/bg_baby.jpg",
    l1: "Bila dah ada baby,", l2: "air panas makin kerap guna.", l3: "Jerang air dah jadi <mark>5 kali sehari.</mark>",
    nota: "Sekarang? Tekan je.", harga: "RM20",
    tnc: "*Pakej serendah RM20 sebulan, penghantaran & pemasangan percuma. Tertakluk terma & syarat." },
];
const UNIT = "img/neon-ciel-34.png";
const SOROTAN = [["Panas", "#E5322D"], ["Sejuk", "#2F8BE6"], ["Suhu bilik", "#80ABCE"]];
const WARNA = ["#CDEBD9", "#BFE1F2", "#F4C7C3", "#B9BDC1", "#F7F5F1"];
const chipHTML = () => SOROTAN.map(([t, c]) => `<span><i style="background:${c}"></i>${t}</span>`).join("")
  + `<span><b class="dots">${WARNA.map(c => `<i style="background:${c}"></i>`).join("")}</b>5 pilihan warna</span>`;
document.getElementById("root").innerHTML = VARIAN.map(v => `
<div class="poster" id="${v.id}">
  <img class="bg" src="${v.bg}">
  <div class="panel"><div class="l1">${v.l1}</div><div class="l2">${v.l2}</div><div class="l3">${v.l3}</div></div>
  <div class="agen">EJEN SAH COWAY</div>
  <div class="nota">${v.nota}<svg viewBox="0 0 70 80"><path d="M10 6 C40 10, 56 30, 50 70 M50 70 l-14 -10 M50 70 l10 -14" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg></div>
  <div class="floor"></div>
  <img class="unit" src="${UNIT}">
  <div class="seal"><small>SERENDAH</small><strong>${v.harga}<span style="font-size:.45em">*</span></strong><em>SEBULAN</em></div>
  <div class="chips">${chipHTML()}</div>
  <div class="cta">WHATSAPP SAYA SEKARANG</div>
  <div class="tnc">${v.tnc}</div>
</div>`).join("");
</script>
</body></html>
