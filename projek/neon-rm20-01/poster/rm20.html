<!doctype html>
<html><head><meta charset="utf-8">
<!-- Poster iklan NeoN "Serendah RM20" (6) — latar Seedream (img/bg), unit = gambar rasmi Coway (img/neon-ciel-34.png) -->
<style>
@font-face{font-family:Nunito;src:url(../../../assets/fonts/NunitoSans-900.ttf);font-weight:900}
@font-face{font-family:Nunito;src:url(../../../assets/fonts/NunitoSans-800.ttf);font-weight:800}
@font-face{font-family:Nunito;src:url(../../../assets/fonts/NunitoSans-700.ttf);font-weight:700}
@font-face{font-family:Anton;src:url(../../../assets/fonts/Anton-Regular.ttf)}
@font-face{font-family:Hand;src:url(../../../assets/fonts/Pacifico-Regular.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#222}
:root{--blue:#1e9bf0;--sky:#3cb6ff;--navy:#0b2a5b}
.poster{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:Nunito,sans-serif;margin-bottom:20px}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.25) 30%,rgba(0,0,0,0) 48%,rgba(0,0,0,0) 78%,rgba(0,0,0,.35) 100%)}
.logo{position:absolute;left:56px;top:50px;width:240px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.neon{position:absolute;right:56px;top:46px;font:300 58px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:14px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.neon b{font-weight:300}
h1{position:absolute;left:56px;top:150px;font-weight:900;font-size:96px;line-height:1.02;letter-spacing:-1px;color:#fff;
  text-shadow:0 4px 18px rgba(0,0,0,.45)}
h1 .b{color:var(--sky)}
.unit{position:absolute;left:40px;bottom:180px;width:440px;filter:brightness(.96) contrast(1.04) drop-shadow(0 18px 18px rgba(0,0,0,.35)) drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.unit img{width:100%;display:block}
.floor{position:absolute;left:70px;bottom:162px;width:440px;height:60px;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,.45),rgba(0,0,0,0) 70%)}
.badge{position:absolute;right:44px;bottom:205px;width:460px;height:380px;transform:rotate(-8deg)}
.badge svg{position:absolute;inset:0}
.badge .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding-top:14px}
.badge .s1{font:800 44px/1 Nunito;letter-spacing:1px}
.badge .s2{font:400 150px/0.95 Anton;letter-spacing:1px;margin:4px 0}
.badge .s3{font:800 44px/1 Nunito;letter-spacing:1px}
.badge sup{font-size:.55em}
.bar{position:absolute;left:56px;right:56px;bottom:52px;height:104px;background:#fff;border-radius:52px;display:flex;align-items:center;padding:0 34px;gap:22px;
  box-shadow:0 8px 24px rgba(0,0,0,.25)}
.bar .txt{flex:1;font:900 32px/1 Nunito;color:var(--navy);letter-spacing:.3px;white-space:nowrap}
.bar .txt b{color:var(--blue);font:400 46px/1 Anton;letter-spacing:1px;margin-left:8px;vertical-align:-3px}
.bar .div{width:3px;height:56px;background:var(--navy);opacity:.6}
.tnc{position:absolute;left:0;right:0;bottom:16px;text-align:center;font:700 19px/1 Nunito;color:rgba(255,255,255,.9);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.doodle{position:absolute;stroke:#fff;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.callout{position:absolute;font:400 46px/1.15 Hand;color:#fff;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.5)}
</style></head><body>

<!-- simbol berkongsi -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="blob" viewBox="0 0 440 360">
      <path d="M44 120C70 46 170 14 262 22c96 8 160 66 160 150 0 92-70 162-188 168C112 346 22 284 18 200c-2-30 10-56 26-80z" fill="#1e9bf0" stroke="#fff" stroke-width="12"/>
      <path d="M392 24l18-20M414 58l26-6M372 8l4-8" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
      <path d="M24 300l-18 18M44 330l-6 22" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    </symbol>
    <symbol id="truck" viewBox="0 0 80 50">
      <path d="M2 10h46v28H2zM48 18h16l12 12v8H48z" fill="#1e9bf0"/>
      <circle cx="16" cy="40" r="7" fill="#1e9bf0" stroke="#fff" stroke-width="3"/>
      <circle cx="62" cy="40" r="7" fill="#1e9bf0" stroke="#fff" stroke-width="3"/>
      <path d="M-14 16h12M-18 24h16M-12 32h10" stroke="#1e9bf0" stroke-width="4" stroke-linecap="round"/>
      <path d="M53 21h9l7 8H53z" fill="#fff"/>
    </symbol>
    <symbol id="tools" viewBox="0 0 48 48">
      <path d="M8 40L30 18M30 18a9 9 0 1 0 6-14l-6 6 2 6 6 2 6-6a9 9 0 0 1-14 6" stroke="#1e9bf0" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M40 40L18 18M8 8l6 2 4 8-4 0-2-4z" stroke="#1e9bf0" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<template id="common">
  <div class="shade"></div>
  <img class="logo" src="img/coway-logo-sky.png">
  <div class="neon">neon</div>
  <div class="floor"></div>
  <div class="unit"><img src="img/neon-ciel-34.png"></div>
  <div class="badge"><svg viewBox="0 0 440 360"><use href="#blob"/></svg>
    <div class="t"><div class="s1">SERENDAH</div><div class="s2">RM20</div><div class="s3">SAHAJA<sup>*</sup></div></div></div>
  <div class="bar">
    <svg width="110" height="66" viewBox="-20 0 100 52"><use href="#truck" x="0" y="0" width="80" height="50"/></svg>
    <div class="txt">PENGHANTARAN &amp; PEMASANGAN<b>PERCUMA<sup style="font-size:.5em">*</sup></b></div>
    <div class="div"></div>
    <svg width="58" height="58" viewBox="0 0 48 48"><use href="#tools" width="48" height="48"/></svg>
  </div>
  <div class="tnc">*Tertakluk terma &amp; syarat. Iklan oleh Ejen Sah Coway.</div>
</template>

<div class="poster" id="p01"><img class="bg" src="img/bg/p01.jpg" style="object-position:60% 0">
  <h1>Air Sejuk<br><span class="b">Habis Lagi?</span></h1>
  <svg class="doodle" style="left:530px;top:150px" width="80" height="80" viewBox="0 0 80 80"><path d="M10 50l20-20M30 66l34-14M44 20l10-14"/></svg>
</div>

<div class="poster" id="p02"><img class="bg" src="img/bg/p02.jpg" style="object-position:60% 0">
  <h1>Menyampah<br><span class="b">Beli Air<br>Setiap Bulan?</span></h1>
  <svg class="doodle" style="left:640px;top:96px" width="120" height="100" viewBox="0 0 120 100"><path d="M60 20c-30-6-50 14-40 34s50 26 70 6-6-44-34-34-24 40 0 44 40-10 30-30-30-10-34 6"/></svg>
</div>

<div class="poster" id="p03"><img class="bg" src="img/bg/p03.jpg" style="object-position:70% 0">
  <h1>Family Kecil?<br><span class="b">Tak Perlu<br>Mesin Besar!</span></h1>
</div>

<div class="poster" id="p04"><img class="bg" src="img/bg/p04.jpg" style="object-position:60% 0">
  <h1>Isteri Dah Lama<br><span class="b">Minta Pasang<br>Coway...</span></h1>
  <svg class="doodle" style="left:470px;top:470px" width="70" height="64" viewBox="0 0 70 64"><path d="M35 56C10 38 4 26 8 16s18-12 27 2c9-14 23-12 27-2s-2 22-27 40z"/></svg>
</div>

<div class="poster" id="p05"><img class="bg" src="img/bg/p05.jpg" style="object-position:50% 0">
  <h1>Sebelum<br>Si Kecil Tiba,<br><span class="b">Air Bersih Dah Sedia.</span></h1>
  <svg class="doodle" style="left:470px;top:480px" width="60" height="56" viewBox="0 0 70 64"><path d="M35 56C10 38 4 26 8 16s18-12 27 2c9-14 23-12 27-2s-2 22-27 40z"/></svg>
</div>

<div class="poster" id="p06"><img class="bg" src="img/bg/p06.jpg" style="object-position:50% 0">
  <h1>Dapur Sempit?<br><span class="b">Masih Boleh<br>Pasang!</span></h1>
  <svg class="doodle" style="left:250px;top:610px" width="250" height="40" viewBox="0 0 250 40"><path d="M16 22H234" style="stroke-dasharray:12 9"/><path d="M16 22l14-11M16 22l14 11M234 22l-14-11M234 22l-14 11"/></svg>
  <svg class="doodle" style="left:470px;top:520px;stroke-dasharray:12 10" width="140" height="110" viewBox="0 0 140 110"><path d="M10 100C30 40 70 20 130 14"/></svg>
  <div class="callout" style="left:600px;top:470px;width:300px">Hanya<br>19.5 cm<br>Lebar</div>
</div>

<script>
const t=document.getElementById('common');
document.querySelectorAll('.poster').forEach(p=>{
  const h=p.querySelector('h1'); p.insertBefore(t.content.cloneNode(true),h);
});
</script>
</body></html>
