<!DOCTYPE html>
<html lang="ms"><head><meta charset="utf-8"><title>Poster H01 — Threads</title>
<style>
@font-face { font-family: P; font-weight: 500; src: url(../../assets/fonts/Poppins-Medium.ttf); }
@font-face { font-family: P; font-weight: 600; src: url(../../assets/fonts/Poppins-SemiBold.ttf); }
@font-face { font-family: P; font-weight: 700; src: url(../../assets/fonts/Poppins-Bold.ttf); }
@font-face { font-family: P; font-weight: 800; src: url(../../assets/fonts/Poppins-ExtraBold.ttf); }
:root { --bg:#0a1530; --bg2:#1d3570; --gold:#e2bd72; --gold2:#f6dca0; --ink:#0a1530; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1350px; overflow:hidden; font-family:P,sans-serif; color:#fff;
  background:radial-gradient(900px 700px at 50% 50%, var(--bg2) 0%, var(--bg) 100%); }
.row { position:absolute; left:36px; right:36px; display:flex; gap:18px; }
.top { top:36px; } .bot { bottom:36px; }
.tile { position:relative; flex:1; height:390px; display:flex; flex-direction:column; border-radius:26px; overflow:hidden; border:3px solid rgba(226,189,114,.55);
  box-shadow:0 18px 40px rgba(0,0,0,.45); background:#0a1530; }
.tile .im { position:relative; flex:1; overflow:hidden; }
.tile img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.tile .lb { flex:none; height:50px; display:flex; align-items:center; padding:0 14px; font-weight:700; font-size:23px; white-space:nowrap;
  background:#0a1530; border-top:2px solid rgba(226,189,114,.55); }
.tile .lb i { font-style:normal; display:inline-block; font-weight:800; font-size:18px; color:var(--ink); background:var(--gold);
  border-radius:20px; padding:2px 10px; margin-right:8px; vertical-align:2px; }
.mid { position:absolute; left:36px; right:36px; top:450px; height:450px; border-radius:34px; overflow:hidden;
  background:linear-gradient(135deg, #10224a 0%, #0a1530 100%); border:4px solid var(--gold); box-shadow:0 26px 70px rgba(0,0,0,.55);
  display:flex; align-items:center; padding:0 46px; gap:40px; }
.mid:before { content:''; position:absolute; inset:0; background:radial-gradient(500px 340px at 82% 50%, rgba(226,189,114,.20), transparent 70%); }
.txt { position:relative; flex:1; }
.kick { display:inline-block; font-weight:800; font-size:30px; letter-spacing:10px; color:var(--ink); background:var(--gold);
  padding:8px 28px 8px 34px; border-radius:40px; }
.t1 { font-weight:700; font-size:40px; margin-top:22px; color:rgba(255,255,255,.92); letter-spacing:1px; }
.t2 { font-weight:800; font-size:70px; line-height:1.02; margin-top:4px; }
.t2 b { color:var(--gold2); }
.sub { font-weight:500; font-size:29px; line-height:1.35; margin-top:18px; color:rgba(255,255,255,.85); }
.side { position:relative; flex:none; display:flex; flex-direction:column; align-items:center; gap:58px; }
.play { position:relative; flex:none; width:210px; height:210px; border-radius:50%; background:var(--gold);
  display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 18px rgba(226,189,114,.18), 0 0 0 38px rgba(226,189,114,.08), 0 20px 50px rgba(0,0,0,.5); }
.play svg { margin-left:16px; }
.cta { font-weight:700; font-size:24px; color:var(--gold2); text-align:center; line-height:1.3; }
</style></head>
<body>
<div class="row top">
  <div class="tile"><div class="im"><img src="../../out/poster/_frames/h01_05.png" style="object-position:50% 15%"></div><div class="lb"><i>01</i>Penat &amp; tak lena</div></div>
  <div class="tile"><div class="im"><img src="../../out/poster/_frames/h01_19.5.png" style="object-position:50% 20%"></div><div class="lb"><i>02</i>Rindu rasa hotel</div></div>
  <div class="tile"><div class="im"><img src="../../out/poster/_frames/h01_45.png" style="object-position:50% 15%"></div><div class="lb"><i>03</i>Fabrik penyejuk</div></div>
</div>
<div class="mid">
  <div class="txt">
    <div class="kick">BONUS</div>
    <div class="t1">VIDEO EXPLAINER</div>
    <div class="t2">Kelebihan<br><b>Tilam Coway</b></div>
    <div class="sub">Kenapa rasa <b style="color:var(--gold2)">sejuk &amp; gebu</b><br>macam tilam hotel?</div>
  </div>
  <div class="side"><div class="play"><svg width="92" height="104" viewBox="0 0 92 104"><path d="M6 6 L86 52 L6 98 Z" fill="#0a1530" stroke="#0a1530" stroke-width="10" stroke-linejoin="round"/></svg></div>
  <div class="cta">Tonton video penuh<br>dalam thread ni ↓</div></div>
</div>
<div class="row bot">
  <div class="tile"><div class="im"><img src="../../out/poster/_frames/h01_63.5.png" style="object-position:50% 53%"></div><div class="lb"><i>04</i>Topper nipis vs tebal</div></div>
  <div class="tile"><div class="im"><img src="../../out/poster/_frames/h01_87.png" style="object-position:50% 52%"></div><div class="lb"><i>05</i>Ketebalan tilam</div></div>
  <div class="tile"><div class="im"><img src="../../out/poster/_frames/h01_96.png" style="object-position:50% 20%"></div><div class="lb"><i>06</i>Macam bercuti</div></div>
</div>
</body></html>
