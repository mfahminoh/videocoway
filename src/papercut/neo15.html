<!DOCTYPE html>
<html lang="ms"><head><meta charset="utf-8"><title>Coway Neo — Paper Cut 15s</title>
<style>
@font-face { font-family: P; font-weight: 600; src: url(../../assets/fonts/Poppins-SemiBold.ttf); }
@font-face { font-family: P; font-weight: 800; src: url(../../assets/fonts/Poppins-ExtraBold.ttf); }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1920px; overflow:hidden; background:#10343a; font-family:P,sans-serif; }
#stage { position:relative; width:1080px; height:1920px; overflow:hidden; }
.scene, .el { position:absolute; }
.scene { inset:0; overflow:hidden; will-change:transform; }
.el { transform-origin:50% 50%; }
/* paper: rough cut edge + hard contact shadow + soft drop shadow */
.paper { filter:url(#rough) drop-shadow(0 8px 0 rgba(0,0,0,.16)) drop-shadow(0 20px 22px rgba(0,0,0,.28)); }
.flat  { filter:url(#rough) drop-shadow(0 6px 0 rgba(0,0,0,.14)) drop-shadow(0 12px 14px rgba(0,0,0,.2)); }
.label { background:#fffaf0; color:#10343a; font-weight:800; text-align:center; line-height:1.08; padding:22px 44px;
         border-radius:14px; white-space:nowrap; }
.label.c1 { background:#ffd23f; } .label.c2 { background:#ff6b57; color:#fff; } .label.c3 { background:#1fb5a4; color:#fff; }
.c { left:0; width:1080px; text-align:center; }
#grain { position:absolute; inset:0; pointer-events:none; mix-blend-mode:multiply; opacity:.5; }
</style></head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="fibre"><feTurbulence type="fractalNoise" baseFrequency="0.9 0.5" numOctaves="3" seed="3"/>
    <feColorMatrix values="0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .45  0 0 0 .55 -.18"/></filter>
</svg>
<div id="stage"></div>
<svg id="grain" width="1080" height="1920"><rect width="1080" height="1920" filter="url(#fibre)"/></svg>
<script>
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstChild; };
const stage = document.getElementById('stage');
const clamp = (v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const backOut = x => { const c1=1.9,c3=c1+1; return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2); };
const outC = x => 1-Math.pow(1-x,3);
const inOut = x => x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;

/* ---------- paper-cut building blocks ---------- */
const stroke = 'stroke="#fffaf0" stroke-width="7" stroke-linejoin="round"';
const doll = (body, skin, hair, w=230, kid=false, dress=false) => {
  const bh = kid ? 150 : 230, hy = kid ? 90 : 80, hr = kid ? 62 : 58, H = hy + hr + bh;
  return `<svg class="paper" width="${w}" viewBox="0 0 230 ${H+14}" style="overflow:visible">
    <path d="M${kid?45:25} ${H} Q${kid?50:30} ${hy+hr+10} 115 ${hy+hr+10} Q${kid?180:200} ${hy+hr+10} ${kid?185:205} ${H} Z" fill="${body}" ${stroke}/>
    ${dress ? `<path d="M30 ${H} L200 ${H}" stroke="#fffaf0" stroke-width="7"/>` : ''}
    <rect x="98" y="${hy+hr-8}" width="34" height="26" fill="${skin}"/>
    <circle cx="115" cy="${hy}" r="${hr}" fill="${skin}" ${stroke}/>
    <path d="M${115-hr} ${hy} Q${115-hr} ${hy-hr-14} 115 ${hy-hr-14} Q${115+hr} ${hy-hr-14} ${115+hr} ${hy} Q${115+hr-12} ${hy-hr+12} 115 ${hy-hr+10} Q${115-hr+12} ${hy-hr+12} ${115-hr} ${hy} Z" fill="${hair}"/>
    ${dress ? `<circle cx="${115+hr-6}" cy="${hy+hr-10}" r="30" fill="${hair}"/>` : ''}
    <circle cx="94" cy="${hy+6}" r="6" fill="#10343a"/><circle cx="136" cy="${hy+6}" r="6" fill="#10343a"/>
    <path d="M97 ${hy+28} Q115 ${hy+46} 133 ${hy+28}" fill="none" stroke="#10343a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="82" cy="${hy+24}" r="9" fill="#ff8a7a" opacity=".6"/><circle cx="148" cy="${hy+24}" r="9" fill="#ff8a7a" opacity=".6"/>
  </svg>`;
};
const cup = (col, w=210) => `<svg class="paper" width="${w}" viewBox="0 0 210 250" style="overflow:visible">
  <path d="M20 60 L190 60 L168 235 L42 235 Z" fill="${col}" ${stroke}/>
  <path d="M30 110 L180 110 L172 170 L38 170 Z" fill="#fffaf0" opacity=".45"/></svg>`;
const steam = (n=3) => `<svg class="flat" width="210" height="190" viewBox="0 0 210 190" style="overflow:visible">${
  [50,105,160].slice(0,n).map((x,i)=>`<path class="stm" data-i="${i}" d="M${x} 180 q-26 -34 0 -62 t0 -62" fill="none" stroke="#fffaf0" stroke-width="14" stroke-linecap="round"/>`).join('')}</svg>`;
const flake = () => `<svg class="flat" width="190" height="190" viewBox="-95 -95 190 190" style="overflow:visible"><g class="spin" stroke="#fffaf0" stroke-width="14" stroke-linecap="round">${
  [0,60,120].map(a=>`<line x1="0" y1="-70" x2="0" y2="70" transform="rotate(${a})"/>`).join('')}</g></svg>`;
const dropSvg = () => `<svg class="flat" width="150" height="190" viewBox="0 0 150 190" style="overflow:visible"><path d="M75 8 Q135 90 135 125 A60 60 0 0 1 15 125 Q15 90 75 8 Z" fill="#fffaf0"/><path d="M45 125 q0 28 28 36" fill="none" stroke="#4fc3f7" stroke-width="10" stroke-linecap="round"/></svg>`;

/* dispenser (compact, 3 taps) — nama model di NAME */
const NAME = 'COWAY NEO';
const unitSvg = (w=300) => `<svg class="paper" width="${w}" viewBox="0 0 300 640" style="overflow:visible">
  <rect x="30" y="20" width="240" height="560" rx="40" fill="#fffaf0" ${stroke.replace('#fffaf0','#e6dcc8')}/>
  <rect x="30" y="20" width="240" height="150" rx="40" fill="#2c4a52"/>
  <rect x="62" y="52" width="176" height="46" rx="14" fill="#10343a"/>
  <rect x="72" y="62" width="60" height="26" rx="8" fill="#4fc3f7"/><text x="150" y="82" font-family="P" font-weight="800" font-size="20" fill="#fffaf0">3 SUHU</text>
  <circle cx="90" cy="138" r="14" fill="#ff6b57"/><circle cx="150" cy="138" r="14" fill="#1fb5a4"/><circle cx="210" cy="138" r="14" fill="#4fc3f7"/>
  <rect x="120" y="200" width="60" height="40" rx="10" fill="#cfc4ad"/>
  <rect x="90" y="240" width="120" height="14" rx="7" fill="#9aa5a8"/>
  <rect x="62" y="520" width="176" height="36" rx="12" fill="#e6dcc8"/>
  <text x="150" y="400" text-anchor="middle" font-family="P" font-weight="800" font-size="40" fill="#10343a">${NAME.replace('COWAY ','')}</text>
  <text x="150" y="432" text-anchor="middle" font-family="P" font-weight="600" font-size="20" fill="#10343a" letter-spacing="4">COWAY</text>
  <rect x="30" y="584" width="240" height="26" rx="10" fill="#2c4a52"/></svg>`;

/* gambar sebenar: letak PNG lutsinar di assets/img/neo-plus.png -> auto ganti lukisan (potongan kertas + garis putih) */
const unit = (w=300) => `<div style="position:relative; width:${w}px; height:${w*2.13}px">
  <img src="../../assets/img/neo-plus.png" class="paper" style="width:${w}px; height:${w*2.13}px; object-fit:contain; filter:url(#rough) drop-shadow(5px 0 0 #fffaf0) drop-shadow(-5px 0 0 #fffaf0) drop-shadow(0 5px 0 #fffaf0) drop-shadow(0 -5px 0 #fffaf0) drop-shadow(0 18px 20px rgba(0,0,0,.3))" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
  <div style="display:none">${unitSvg(w)}</div></div>`;

const wa = `<svg width="86" height="86" viewBox="0 0 24 24" style="flex:none"><path fill="#fff" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2s.2-1.1.1-1.2-.2-.2-.5-.3z"/></svg>`;

/* layered paper hills as scene background */
const layers = (cols, base=640, amp=120) => cols.map((c,i)=>{
  const y = base + i*210, a = amp - i*18;
  return `<svg class="el paper" style="left:-40px; top:${y}px" width="1160" height="${1920-y+60}" viewBox="0 0 1160 ${1920-y+60}" preserveAspectRatio="none">
    <path d="M0 ${a} Q200 ${-a*.2} 420 ${a*.7} T820 ${a*.5} T1160 ${a*.9} L1160 2000 L0 2000 Z" fill="${c}"/></svg>`;}).join('');

/* ---------- scenes ---------- */
const SC = [];
function scene(s, e, bg, html) {
  const el = $(`<div class="scene" style="background:${bg}">${html}</div>`);
  stage.appendChild(el);
  const items = [...el.querySelectorAll('[data-in]')].map(n => ({ n, t:+n.dataset.in, a:n.dataset.a||'pop', r:+(n.dataset.r||0) }));
  SC.push({ el, s, e, items });
}
const P = (style, inner, o={}) => `<div class="el ${o.cls||''}" style="${style}" data-in="${o.in??0}" data-a="${o.a||'pop'}" data-r="${o.r||0}">${inner}</div>`;
const L = (text, size, top, o={}) => `<div class="el c" style="top:${top}px" data-in="${o.in??0}" data-a="${o.a||'pop'}"><span class="label flat ${o.c||''}" style="font-size:${size}px; display:inline-block; transform:rotate(${o.r||0}deg)">${text}</span></div>`;

// 1 — hook: family kecil
scene(0, 3.2, '#1b6e7a', layers(['#2a8c94','#f2b84b','#e9895b'], 1050, 110) + `
  ${P('left:50px; top:1020px', doll('#ff6b57','#f0c29a','#3b2412',270), {in:.25})}
  ${P('left:300px; top:1000px', doll('#ffd23f','#e0ac7e','#10343a',260,false,true), {in:.4})}
  ${P('left:560px; top:1240px', doll('#4fc3f7','#f0c29a','#6b3b1c',210,true), {in:.55})}
  ${P('left:770px; top:1215px', doll('#9be15d','#c98b5e','#10343a',220,true,true), {in:.7})}
  ${L('Keluarga bawah', 84, 200, {in:.1, r:-2})}
  ${L('5 ORANG?', 150, 350, {in:.3, c:'c1', r:2})}
  ${L('Ni model <span style="color:#ff6b57">PALING BEST!</span>', 74, 660, {in:1.5, r:-1.5})}
`);

// 2 — 3 suhu
scene(3.2, 6.2, '#f2b84b', layers(['#ffe08a','#ff9d6b','#c8553d'], 1180, 100) + `
  ${L('Kenapa? <span style="color:#ff6b57">LENGKAP</span>', 78, 130, {in:.1, r:-1.5})}
  ${L('3 SUHU', 170, 270, {in:.3, c:'c2', r:1.5})}
  ${P('left:85px; top:780px', cup('#ff6b57'), {in:.7})}
  ${P('left:85px; top:640px', steam(3), {in:.9, a:'fade', cls:''})}
  ${P('left:435px; top:780px', cup('#1fb5a4'), {in:1.0})}
  ${P('left:455px; top:610px', dropSvg(), {in:1.2})}
  ${P('left:785px; top:780px', cup('#4fc3f7'), {in:1.3})}
  ${P('left:795px; top:620px', flake(), {in:1.5})}
  ${L('PANAS', 52, 1090, {in:.9, c:'c2'}).replace('class="el c" style="top','class="el" style="left:55px; width:270px; top')}
  ${L('BIASA', 52, 1090, {in:1.2, c:'c3'}).replace('class="el c" style="top','class="el" style="left:405px; width:270px; top')}
  ${L('SEJUK', 52, 1090, {in:1.5}).replace('class="el c" style="top','class="el" style="left:755px; width:270px; top')}
  ${P('left:370px; top:1430px', doll('#ff6b57','#f0c29a','#3b2412',330,false,true), {in:1.9})}
`);

// 3 — compact
scene(6.2, 9.2, '#e9895b', layers(['#f6c9a0','#c8553d','#7a2f2a'], 1100, 90) + `
  ${L('Size <span style="color:#ff6b57">COMPACT</span>', 100, 130, {in:.1, r:1.5})}
  ${L('muat dapur kecil', 62, 300, {in:.5, r:-1.5, c:'c1'})}
  ${P('left:110px; top:470px', `<div class="paper" style="width:860px;height:860px;background:#fffaf0;padding:18px;border-radius:10px"><img src="../../assets/img/neo-lineup.jpg" style="width:100%;height:100%;object-fit:cover;display:block"></div>`, {in:.6, a:'left'})}
  ${L('3 suhu · 1 mesin kecil', 52, 1470, {in:1.8, c:'c3'})}
`);

// 4 — promo
scene(9.2, 12.2, '#1b6e7a', layers(['#2a8c94','#ffd23f','#ff6b57'], 1300, 90) + `
  ${L('PROMO', 90, 130, {in:.1, c:'c2', r:-3})}
  ${L('Rebat Ulang Tahun Coway', 56, 330, {in:.4, r:1})}
  ${L('RM20 × 7 BULAN', 112, 470, {in:.7, c:'c1', r:-2})}
  ${L('✓ Pemasangan PERCUMA', 58, 780, {in:1.4, r:1.5})}
  ${L('✓ Servis setiap 2 / 4 bulan', 54, 930, {in:1.8, r:-1.5})}
  ${P('left:60px; top:1180px; transform-origin:0 0', `<div class="paper" style="width:330px;height:330px;background:#fffaf0;padding:18px;border-radius:10px"><img src="../../assets/img/neo-colours.jpg" style="width:100%;height:100%;object-fit:cover;display:block"></div>`, {in:.9})}
  ${L('LAST CALL!', 84, 1560, {in:2.3, c:'c2', r:-3})}
  <div id="conf"></div>
`);

// 5 — CTA
scene(12.2, 15.0, '#ffd23f', layers(['#ffe590','#ff9d6b','#c8553d'], 1250, 100) + `
  ${L(NAME, 92, 150, {in:.1, c:'c3', r:-2})}
  ${L('Sesuai untuk keluarga kecil', 52, 310, {in:.4, r:1.5})}
  ${P('left:150px; top:470px', `<div class="paper" style="width:780px;height:780px;background:#fffaf0;padding:18px;border-radius:10px"><img src="../../assets/img/neo-colours.jpg" style="width:100%;height:100%;object-fit:cover;display:block"></div>`, {in:.7})}
  <div class="el c" style="top:1380px" data-in="1.0" data-a="pop"><span class="flat" style="display:inline-flex; align-items:center; gap:22px; background:#25d366; color:#fff; font-weight:800; font-size:52px; padding:30px 56px; border-radius:90px; white-space:nowrap">${wa} WHATSAPP SAYA</span></div>
  ${L('Tanya promo hari ni', 50, 1600, {in:1.5})}
`);

/* ---------- animation ---------- */
const FPS_SM = 12;                                  // stop-motion step
function seek(t) {
  const q = Math.floor(t * FPS_SM) / FPS_SM;        // quantised time for the cut-paper feel
  SC.forEach((sc, i) => {
    const k = q - sc.s, vis = q >= sc.s - .4 && (i === SC.length - 1 || q < SC[i + 1].s);
    sc.el.style.display = vis ? '' : 'none';
    if (!vis) return;
    const sl = i === 0 ? 1 : outC(clamp((q - (sc.s - .4)) / .4));            // sheet slides over the previous one
    sc.el.style.transform = `translateY(${(1 - sl) * 1920}px) rotate(${(1 - sl) * 2}deg)`;
    sc.el.style.boxShadow = '0 -30px 60px rgba(0,0,0,.35)';
    sc.items.forEach(it => {
      const x = (k - it.t) / .45;
      const wob = Math.sin(q * 7 + it.t * 3) * 1.2;
      if (x < 0) { it.n.style.visibility = 'hidden'; return; }
      it.n.style.visibility = 'visible';
      const e = clamp(x);
      let tr = '', op = 1;
      if (it.a === 'left') tr = `translateX(${(1 - outC(e)) * -700}px)`;
      else if (it.a === 'fade') op = e;
      else tr = `scale(${.2 + .8 * backOut(e)}) rotate(${(1 - e) * -12}deg)`;
      it.n.style.opacity = op;
      it.n.style.transform = tr + ` rotate(${wob}deg)`;
    });
    sc.el.querySelectorAll('.stm').forEach(p => p.style.transform = `translateY(${Math.sin(q * 6 + +p.dataset.i * 2) * 8}px)`);
    sc.el.querySelectorAll('.spin').forEach(p => p.style.transform = `rotate(${q * 60}deg)`);
  });
  // confetti (paper bits) in promo scene
  const cf = document.getElementById('conf'), pk = q - 9.2;
  if (cf && !cf.children.length) for (let i = 0; i < 26; i++) {
    const c = ['#ffd23f','#ff6b57','#fffaf0','#4fc3f7','#9be15d'][i % 5];
    cf.insertAdjacentHTML('beforeend', `<div class="el flat" style="width:${22 + i % 3 * 8}px; height:${34 + i % 4 * 6}px; background:${c}; left:${(i * 83) % 1040}px; top:0"></div>`);
  }
  if (cf) [...cf.children].forEach((d, i) => {
    const y = ((pk - .3 - (i % 7) * .12) * 520 + i * 40) % 2100 - 120;
    d.style.visibility = pk > .3 && pk < 3.1 ? 'visible' : 'hidden';
    d.style.transform = `translateY(${y}px) rotate(${q * 120 + i * 40}deg)`;
  });
}
if (/[?&]wm=1/.test(location.search)) {
  const tile = Array.from({length: 16}, (_, i) => `<span style="position:absolute; left:${(i % 2) * 760 - 250 + (Math.floor(i / 2) % 2) * 380}px; top:${Math.floor(i / 2) * 330 - 150}px">SAMPLE</span>`).join('');
  stage.insertAdjacentHTML('beforeend', `<div style="position:absolute; inset:0; z-index:99; pointer-events:none; overflow:hidden">
    <div style="position:absolute; inset:-300px; transform:rotate(-28deg); font:800 120px P,sans-serif; letter-spacing:8px; color:rgba(255,255,255,.34); text-shadow:0 0 0 rgba(0,0,0,.2); -webkit-text-stroke:3px rgba(0,0,0,.18)">${tile}</div>
    <div style="position:absolute; left:0; right:0; bottom:60px; text-align:center"><span style="display:inline-block; background:rgba(16,52,58,.88); color:#fff; font:800 40px P,sans-serif; padding:18px 38px; border-radius:16px; border:4px solid #ffd23f">SAMPLE · DM untuk beli pakej 30 video</span></div></div>`);
}
window.DURATION = 15.0; window.seek = seek; seek(0);
</script></body></html>
