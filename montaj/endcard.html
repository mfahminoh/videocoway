<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Kad Promo Neo Plus</title>
<style>
  @font-face { font-family: P; font-weight: 500; src: url(../assets/fonts/Poppins-Medium.ttf); }
  @font-face { font-family: P; font-weight: 600; src: url(../assets/fonts/Poppins-SemiBold.ttf); }
  @font-face { font-family: P; font-weight: 700; src: url(../assets/fonts/Poppins-Bold.ttf); }
  @font-face { font-family: P; font-weight: 800; src: url(../assets/fonts/Poppins-ExtraBold.ttf); }
  :root { --navy: #0B2F6B; --blue: #0B4DA2; --sky: #2EA7E0; --hot: #E5322D; --yellow: #FFD23F; --wa: #25D366; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #062A5E; }
  body { font-family: P, sans-serif; color: #fff; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden;
           background: radial-gradient(ellipse at 50% 32%, #1c74d6 0, #0B4DA2 42%, #062A5E 100%); }
  #stage::after { content: ""; position: absolute; inset: 0; pointer-events: none;
           background: repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 40px, transparent 40px 80px); }
  .el { position: absolute; will-change: transform, opacity; transform-origin: 50% 50%; }
  .c { left: 0; width: 1080px; text-align: center; }
  .pill { display: inline-block; padding: 14px 44px; border-radius: 60px; font-weight: 800; letter-spacing: 3px; font-size: 46px; }
</style>
</head>
<body>
<div id="stage">
  <div class="el" id="rays" style="top:-200px; left:-460px; width:2000px; height:2000px;
       background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.06) 0 8deg, transparent 8deg 20deg)"></div>
  <div class="el c" id="pill" style="top:190px"><span class="pill" style="background:var(--yellow); color:var(--navy)">DOUBLE PROMO!</span></div>
  <div class="el" id="glow" style="top:250px; left:290px; width:500px; height:500px; border-radius:50%;
       background: radial-gradient(circle, rgba(92,200,255,.55) 0, rgba(46,167,224,.12) 45%, transparent 70%)"></div>
  <img class="el" id="prod" src="../assets/img/neoplus-front.png" style="top:300px; left:436px; width:208px; height:410px">
  <div class="el c" id="name" style="top:715px; font-size:40px; font-weight:600; letter-spacing:12px; color:var(--sky)">COWAY <span style="color:#fff; letter-spacing:2px; font-weight:800; font-size:64px">Neo Plus</span></div>
  <div class="el c" id="p59" style="top:810px; white-space:nowrap; line-height:1.1">
    <span style="font-size:110px; font-weight:800">RM59</span><span style="font-size:46px; font-weight:600; opacity:.9">/bulan</span></div>
  <div class="el" id="card" style="top:970px; left:110px; width:860px; height:300px; border-radius:40px; background:var(--yellow); color:var(--navy);
       box-shadow:0 30px 70px rgba(0,0,0,.35); text-align:center; padding-top:34px">
    <div style="font-size:46px; font-weight:800; letter-spacing:3px">7 BULAN PERTAMA</div>
    <div style="line-height:1; white-space:nowrap; margin-top:4px"><span style="font-size:44px; font-weight:700">cuma </span><span style="font-size:160px; font-weight:800">RM20</span><span style="font-size:48px; font-weight:700">/bulan</span></div>
  </div>
  <div class="el c" id="free" style="top:1300px; font-size:44px; font-weight:700">✓ Penghantaran &amp; pemasangan <span style="color:var(--yellow)">PERCUMA</span></div>
  <div class="el" id="btn" style="top:1395px; left:120px; width:840px; height:140px; border-radius:80px; background:var(--wa);
       display:flex; align-items:center; justify-content:center; gap:22px; font-size:50px; font-weight:800; white-space:nowrap; box-shadow:0 20px 50px rgba(37,211,102,.45)">
    <svg width="64" height="64" viewBox="0 0 24 24" style="flex:none"><path fill="#fff" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2s.2-1.1.1-1.2-.2-.2-.5-.3z"/></svg>
    WHATSAPP SEKARANG</div>
  <svg class="el" id="tap" style="top:1470px; left:840px" width="130" height="150" viewBox="0 0 140 160">
    <path d="M52 20 Q52 4 66 4 Q80 4 80 20 V70 L112 76 Q132 80 128 100 L120 140 Q116 156 100 156 H62 Q50 156 42 146 L12 104 Q4 92 14 86 Q24 80 34 90 L52 108 Z" fill="#fff" stroke="#1b2330" stroke-width="7" stroke-linejoin="round"/></svg>
  <div class="el c" id="tnc" style="top:1640px; font-size:28px; opacity:.7">*Bulan ke-8 dan seterusnya RM59/bulan. Tertakluk kepada terma &amp; syarat.</div>
  <div class="el" id="flash" style="inset:0; background:#fff"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const E = { out: x => 1 - Math.pow(1 - x, 3), back: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); } };
const p = (t, a, b, e = E.out) => e(clamp((t - a) / (b - a)));
const mix = (a, b, k) => a + (b - a) * k;
function set(id, { o = 1, x = 0, y = 0, s = 1, r = 0 } = {}) {
  const el = $(id); el.style.opacity = o; el.style.visibility = o <= .001 ? 'hidden' : 'visible';
  el.style.transform = `translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;
}
function pop(id, t, t0, { from = .3, dy = 0, r = 0 } = {}) { const a = p(t, t0, t0 + .4, E.back); set(id, { o: clamp(a * 2.5), s: mix(from, 1, a), y: mix(dy, 0, a), r }); }
window.DURATION = 5.0;
function seek(t) {
  set('flash', { o: 1 - p(t, 0, .25) });
  set('rays', { o: .9, r: t * 12 });
  pop('pill', t, .1, { r: Math.sin(t * 9) * 2.5 * clamp(t - .6) });
  { const a = p(t, .05, .6); set('prod', { o: a, y: mix(120, 0, a) + Math.sin(t * 2.4) * 6, s: mix(.8, 1, a) }); set('glow', { o: a * (.85 + .15 * Math.sin(t * 3)), s: mix(.5, 1, a) }); }
  pop('name', t, .35, { from: .7, dy: 30 });
  pop('p59', t, .6, { from: .5 });
  { const a = p(t, 1.0, 1.3), b = p(t, 1.0, 1.45, E.back); set('card', { o: clamp(a * 3), s: mix(2.0, 1, a) * (1 + .03 * Math.sin(clamp((t - 1.5) * 3) * Math.PI)), r: mix(-6, 0, b) }); }
  pop('free', t, 1.8, { from: .6, dy: 40 });
  { const a = p(t, 2.4, 2.8, E.back), tap = Math.max(0, Math.sin(clamp((t - 3.4) / .5) * Math.PI));
    const pulse = 1 + .04 * Math.max(0, Math.sin((t - 2.8) * 6)) * (t > 2.8 ? 1 : 0);
    set('btn', { o: clamp(a * 2), s: mix(.5, 1, a) * pulse * (1 - tap * .06), y: mix(60, 0, a) });
    const h = p(t, 2.9, 3.3); set('tap', { o: clamp(h * 2), x: mix(150, 0, h) - tap * 10, y: mix(150, 0, h) + tap * 10, s: 1 - tap * .1 }); }
  pop('tnc', t, 2.2, { from: 1, dy: 10 });
}
window.seek = seek; seek(0);
</script>
</body>
</html>
